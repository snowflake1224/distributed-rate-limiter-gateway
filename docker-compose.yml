services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: dev-admin-key-change-me
      API_KEY_PEPPER: dev-pepper-change-me
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build: .
    command: ["node", "dist/db/seed.js"]
    environment:
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: dev-admin-key-change-me
      API_KEY_PEPPER: dev-pepper-change-me
      UPSTREAM_HEALTHY_URL: http://upstream-ok:4000
      UPSTREAM_FLAKY_URL: http://upstream-flaky:4000
      SEED_OUTPUT_PATH: /output/seed-secrets.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./.local:/output

  upstream-ok:
    build: .
    command: ["node", "dist/upstream/server.js"]
    environment:
      PORT: 4000
      UPSTREAM_MODE: ok

  upstream-flaky:
    build: .
    command: ["node", "dist/upstream/server.js"]
    environment:
      PORT: 4000
      UPSTREAM_MODE: flaky
      UPSTREAM_ERROR_RATE: "0.75"

  upstream-slow:
    build: .
    command: ["node", "dist/upstream/server.js"]
    environment:
      PORT: 4000
      UPSTREAM_MODE: slow
      UPSTREAM_DELAY_MS: "2500"

  gateway-1:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      INSTANCE_ID: gateway-1
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: dev-admin-key-change-me
      API_KEY_PEPPER: dev-pepper-change-me
      POLICY_CACHE_TTL_MS: 5000
      API_KEY_CACHE_TTL_MS: 5000
      REDIS_COMMAND_TIMEOUT_MS: 200
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      upstream-ok:
        condition: service_started
      upstream-flaky:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-2:
    build: .
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      INSTANCE_ID: gateway-2
      DATABASE_URL: postgres://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      ADMIN_API_KEY: dev-admin-key-change-me
      API_KEY_PEPPER: dev-pepper-change-me
      POLICY_CACHE_TTL_MS: 5000
      API_KEY_CACHE_TTL_MS: 5000
      REDIS_COMMAND_TIMEOUT_MS: 200
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./demo/gateway-demo.html:/usr/share/nginx/html/gateway-demo.html:ro
    depends_on:
      gateway-1:
        condition: service_healthy
      gateway-2:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway-1
      - gateway-2

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
