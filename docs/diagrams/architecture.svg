<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" role="img" aria-labelledby="g-t g-d">
  <title id="g-t">Distributed Rate Limiter &amp; API Gateway Architecture</title>
  <desc>Nginx balances stateless Node.js gateway instances sharing atomic Redis Lua rate limits (token bucket and sliding window) and PostgreSQL policy storage with per-instance TtlLruCache and CircuitBreaker protection.</desc>
  <defs>
    <style>
      .bg { fill: #0a0f1a; }
      .grid { stroke: #162033; stroke-width: 1; }
      .card { fill: #111927; stroke: #263449; stroke-width: 1.5; rx: 12; }
      .card-sky { fill: #0f1b2d; stroke: #38bdf8; stroke-width: 1.75; rx: 12; }
      .card-redis { fill: #1b1322; stroke: #f43f5e; stroke-width: 1.75; rx: 12; }
      .card-amber { fill: #1d170d; stroke: #f59e0b; stroke-width: 1.5; rx: 12; }
      .card-obs { fill: #0f1c1a; stroke: #10b981; stroke-width: 1.5; rx: 12; }
      .h1 { font: 700 18px 'Inter', system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 500 12px 'Inter', system-ui, sans-serif; fill: #94a3b8; }
      .box-title { font: 700 13.5px 'Inter', system-ui, sans-serif; fill: #f8fafc; }
      .box-sub { font: 500 11.5px 'Inter', system-ui, sans-serif; fill: #94a3b8; }
      .pill { fill: #1e293b; rx: 6; }
      .pill-text { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7dd3fc; }
      .arrow { stroke: #64748b; stroke-width: 1.75; fill: none; marker-end: url(#a); }
      .arrow-sky { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#a-sky); }
      .arrow-rose { stroke: #f43f5e; stroke-width: 2; fill: none; marker-end: url(#a-rose); }
      .arrow-dash { stroke: #475569; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#a); }
      .lbl { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cbd5e1; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#64748b"/></marker>
    <marker id="a-sky" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#38bdf8"/></marker>
    <marker id="a-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#f43f5e"/></marker>
  </defs>

  <rect width="1120" height="600" class="bg"/>
  <g opacity="0.45">
    <line x1="0" y1="80" x2="1120" y2="80" class="grid"/>
    <line x1="0" y1="220" x2="1120" y2="220" class="grid"/>
    <line x1="0" y1="360" x2="1120" y2="360" class="grid"/>
    <line x1="0" y1="500" x2="1120" y2="500" class="grid"/>
  </g>

  <text x="32" y="38" class="h1">Distributed Rate Limiter &amp; API Gateway &#8212; System Architecture</text>
  <text x="32" y="58" class="sub">Stateless Gateways + Atomic Redis Lua Limits + PostgreSQL Policies + Per-Instance Circuit Breakers</text>

  <rect x="32" y="130" width="170" height="104" class="card"/>
  <text x="48" y="158" class="box-title">Clients &amp; Gateway Lab</text>
  <text x="48" y="178" class="box-sub">UI at / (:8080) + /demo/v1/*</text>
  <text x="48" y="196" class="box-sub">Sends X-API-Key +</text>
  <rect x="48" y="204" width="128" height="20" class="pill"/>
  <text x="56" y="218" class="pill-text">optional x-user-id</text>

  <rect x="242" y="130" width="160" height="104" class="card-sky"/>
  <text x="260" y="158" class="box-title">Nginx Edge (:8080)</text>
  <text x="260" y="178" class="box-sub">least_conn load balancer</text>
  <text x="260" y="196" class="box-sub">404 on /admin &amp; /metrics</text>
  <text x="260" y="214" class="box-sub">302 /demo/ -&gt; / (Lab UI)</text>

  <rect x="454" y="96" width="242" height="82" class="card-sky"/>
  <text x="472" y="122" class="box-title">gateway-1 (:3000)</text>
  <text x="472" y="142" class="box-sub">SHA-256 key auth &#183; TtlLruCache (5s)</text>
  <text x="472" y="160" class="box-sub">Per-upstream CircuitBreaker</text>

  <rect x="454" y="196" width="242" height="82" class="card-sky"/>
  <text x="472" y="222" class="box-title">gateway-2 (:3002)</text>
  <text x="472" y="242" class="box-sub">SHA-256 key auth &#183; TtlLruCache (5s)</text>
  <text x="472" y="260" class="box-sub">Per-upstream CircuitBreaker</text>

  <rect x="440" y="330" width="270" height="114" class="card"/>
  <text x="458" y="358" class="box-title">PostgreSQL 16 (Control Plane)</text>
  <text x="458" y="378" class="box-sub">tenants, api_keys, policies, routes, upstreams</text>
  <text x="458" y="396" class="box-sub">demo_sandboxes (30-min TTL)</text>
  <rect x="458" y="408" width="232" height="22" class="pill"/>
  <text x="466" y="423" class="pill-text">pg_advisory_xact_lock(727101)</text>

  <rect x="772" y="96" width="316" height="122" class="card-redis"/>
  <text x="790" y="124" class="box-title">Redis 7 (Shared Limit Counters)</text>
  <text x="790" y="146" class="box-sub">token_bucket.lua (HSET tokens, ts + TIME)</text>
  <text x="790" y="164" class="box-sub">sliding_window.lua (ZREMRANGEBYSCORE + TIME)</text>
  <text x="790" y="182" class="box-sub">200ms commandTimeout &#183; fail_closed =&gt; 503</text>
  <rect x="790" y="192" width="275" height="20" class="pill"/>
  <text x="798" y="206" class="pill-text">rl:algo:tenant:policy:vN:&lt;sha256(dims)&gt;</text>

  <rect x="772" y="260" width="316" height="112" class="card-amber"/>
  <text x="790" y="288" class="box-title">Upstream Services</text>
  <text x="790" y="308" class="box-sub">upstream-ok, upstream-flaky, upstream-lab</text>
  <text x="790" y="326" class="box-sub">SSRF-validated lab paths (/lab/:id/r:rev)</text>
  <text x="790" y="344" class="box-sub">Protected by closed / open / half_open breaker</text>

  <rect x="32" y="476" width="365" height="92" class="card-obs"/>
  <text x="50" y="504" class="box-title">Observability Stack</text>
  <text x="50" y="524" class="box-sub">Prometheus (:9090) scrapes gateway-1 &amp; gateway-2 /metrics</text>
  <text x="50" y="544" class="box-sub">Grafana (:3001): allowed, rejected (429), breaker state</text>

  <rect x="440" y="476" width="648" height="92" class="card"/>
  <text x="458" y="504" class="box-title">Measured Behavior (Single Shared Counter Across Two Instances)</text>
  <text x="458" y="524" class="box-sub">" Concurrent 100-req burst across :3000 &amp; :3002 admits exactly `capacity` requests; rest receive HTTP 429 + Retry-After.</text>
  <text x="458" y="544" class="box-sub">" Laptop k6 baseline (2026-08-19): ~80 req/s (1 instance) -&gt; ~152-157 req/s (2 instances), shared allowed quota invariant.</text>

  <path d="M 202 182 L 239 182" class="arrow-sky"/>
  <path d="M 402 162 L 451 138" class="arrow-sky"/>
  <path d="M 402 204 L 451 232" class="arrow-sky"/>

  <path d="M 575 278 L 575 327" class="arrow"/>
  <text x="583" y="308" class="lbl">5s cache miss</text>

  <path d="M 696 138 L 769 138" class="arrow-rose"/>
  <text x="706" y="128" class="lbl">Lua atomic</text>
  <path d="M 696 226 L 732 226 L 732 178 L 769 178" class="arrow-rose"/>

  <path d="M 696 258 L 732 258 L 732 308 L 769 308" class="arrow-sky"/>
  <text x="705" y="294" class="lbl">proxy</text>

  <path d="M 215 476 L 215 390 L 437 390" class="arrow-dash"/>
</svg>
