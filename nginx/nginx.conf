worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format gateway '$remote_addr $request_id $status $request_time $upstream_addr $request';
  access_log /var/log/nginx/access.log gateway;
  error_log /var/log/nginx/error.log warn;

  # Trust X-Forwarded-For only from private networks (Docker, the host edge proxy).
  # $remote_addr becomes the first untrusted address, so per-IP limits work behind
  # a reverse proxy and clients cannot spoof their IP with their own header.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=demo:1m rate=40r/s;
  limit_req_zone $binary_remote_addr zone=lab_control:1m rate=5r/s;

  upstream gateway_instances {
    least_conn;
    server gateway-1:3000 max_fails=3 fail_timeout=5s;
    server gateway-2:3000 max_fails=3 fail_timeout=5s;
  }

  server {
    listen 8080;
    absolute_redirect off;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    location /health/live {
      proxy_pass http://gateway_instances;
    }

    # Admin API and metrics are reachable only inside the Compose network
    # (gateway-1:3000 / gateway-2:3000), never through the public edge.
    location /admin/ {
      return 404;
    }

    location = /metrics {
      return 404;
    }

    location = / {
      return 302 /demo/;
    }

    location = /favicon.ico {
      access_log off;
      return 204;
    }

    location = /demo {
      return 301 /demo/;
    }

    location /demo/v1/ {
      limit_req zone=lab_control burst=30 nodelay;
      # Server-side bursts wait for up to 200 upstream calls.
      proxy_read_timeout 60s;
      proxy_pass http://gateway_instances;
    }

    location /demo/assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location /demo/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /demo/index.html;
    }

    location / {
      limit_req zone=demo burst=80 nodelay;
      proxy_pass http://gateway_instances;
    }
  }
}
