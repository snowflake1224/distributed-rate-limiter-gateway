worker_processes auto;

events {
  worker_connections 2048;
}

http {
  log_format gateway '$remote_addr $request_id $status $request_time $upstream_addr $request';
  access_log /var/log/nginx/access.log gateway;
  error_log /var/log/nginx/error.log warn;

  upstream gateway_instances {
    least_conn;
    server gateway-1:3000 max_fails=3 fail_timeout=5s;
    server gateway-2:3000 max_fails=3 fail_timeout=5s;
  }

  server {
    listen 8080;

    location /health/live {
      proxy_pass http://gateway_instances;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_send_timeout 10s;
      proxy_read_timeout 10s;
      proxy_pass http://gateway_instances;
    }
  }
}
